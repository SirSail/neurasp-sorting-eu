[project]
name = "neurasp-sorting-eu"
version = "0.1.0"
description = "NeurASP implementation for sorting 5 integers - Team EU"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Team EU"}
]
dependencies = [
    "clingo>=5.8.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "tqdm>=4.67.1",
    "torch==2.9.1+cpu",
    "scikit-learn>=1.8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
